name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  web:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: Build web
        working-directory: frontend
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: web
          retention-days: 1

  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          suffix=""
          if [ "$GOOS" = "windows" ]; then suffix=".exe"; fi
          stage="dist/linode-panel_${version}_${GOOS}_${GOARCH}"
          mkdir -p "$stage"
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "$stage/linode-panel${suffix}" .
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "$stage/linode-panel-agent${suffix}" ./cmd/agent
          cp README.md "$stage/"
          if [ "$GOOS" = "windows" ]; then
            (cd "$stage" && zip -q -r "../linode-panel_${version}_${GOOS}_${GOARCH}.zip" .)
            rm -rf "$stage"
          else
            tar -czf "dist/linode-panel_${version}_${GOOS}_${GOARCH}.tar.gz" -C "$stage" .
            rm -rf "$stage"
          fi
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -lh dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi
