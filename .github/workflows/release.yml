name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build web assets
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web
          # Dockerfile 用 COPY --from=web /src/web ./web；
          # release 二进制用 go:embed web，同样需要这份产物。
          path: web/
          if-no-files-found: error
          retention-days: 1

  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: web
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # linux/arm64 用原生 ARM runner，可直接运行 smoke test；
          # 其余纯交叉编译，用 ubuntu-latest 即可。
          - { goos: linux, goarch: amd64, runs-on: ubuntu-latest }
          - { goos: linux, goarch: arm64, runs-on: ubuntu-24.04-arm }
          - { goos: darwin, goarch: amd64, runs-on: ubuntu-latest }
          - { goos: darwin, goarch: arm64, runs-on: ubuntu-latest }
          - { goos: windows, goarch: amd64, runs-on: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          suffix=""
          if [ "$GOOS" = "windows" ]; then suffix=".exe"; fi
          stage="dist/linode-panel_${version}_${GOOS}_${GOARCH}"
          mkdir -p "$stage"
          go build -trimpath -ldflags "-s -w" -o "$stage/linode-panel${suffix}" .
          go build -trimpath -ldflags "-s -w" -o "$stage/linode-panel-agent${suffix}" ./cmd/agent
          cp README.md "$stage/"
          if [ "$GOOS" = "windows" ]; then
            (cd "$stage" && zip -q -r "../linode-panel_${version}_${GOOS}_${GOARCH}.zip" .)
            rm -rf "$stage"
          else
            tar -czf "dist/linode-panel_${version}_${GOOS}_${GOARCH}.tar.gz" -C "$stage" .
            rm -rf "$stage"
          fi
          ls -lh dist

      - name: Smoke test (linux only)
        if: matrix.goos == 'linux'
        run: |
          set -euo pipefail
          bin=$(ls dist/*.tar.gz | head -1)
          tmp=$(mktemp -d)
          tar -xzf "$bin" -C "$tmp"
          "$tmp/linode-panel" --help >/dev/null
          "$tmp/linode-panel-agent" --help >/dev/null 2>&1 || true

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -lh dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi
